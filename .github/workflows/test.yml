name: Run Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31 # Required for the nix plugin.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.5
          experimental: true # Required for the nix plugin.
          cache: false # Nix-backed tools contain runner-local /nix/store symlinks.
      - run: mise -E dev install --locked
      - run: cp apps/wbapi/.env.example apps/wbapi/.env
      - uses: rharkor/caching-for-turbo@v2.5.1
      - run: mise run verify
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/stats-site/test-results
          if-no-files-found: ignore
