[tools]
# Sync with package.json.
node = "26.6.0"
pnpm = "11.20.0"
bun = "1.3.14"

[env]
# PostgreSQL needs its catalog data and extension libraries at runtime.
MISE_NIX_LINK_PATHS = "bin,sbin,lib,share/postgresql,share/man,share/info,share/doc,share/bash-completion,share/zsh,share/fish"

[tasks.install]
description = "Install node dependencies"
run = "mise -E dev exec -- pnpm install --frozen-lockfile"

[tasks."db:start"]
description = "Start a local PostgreSQL database"
run = '''
#!/usr/bin/env -S mise -E dev exec -- bash

set -euo pipefail

data_dir="${MISE_PROJECT_ROOT}/.mise/postgres"

if [[ -s "$data_dir/PG_VERSION" ]] && pg_ctl --pgdata="$data_dir" status >/dev/null 2>&1; then
    exit 0
fi

if pg_isready --host=127.0.0.1 --port=5432 >/dev/null 2>&1; then
    echo "Port 5432 is already used by another PostgreSQL server" >&2
    exit 1
fi

rm -rf "$data_dir"
mkdir -p "$data_dir"
initdb --pgdata="$data_dir" --auth=trust --encoding=UTF8 --no-locale

pg_ctl \
    --pgdata="$data_dir" \
    --log="$data_dir/postgres.log" \
    --options="-h 127.0.0.1 -p 5432 -k /tmp" \
    --wait \
    start

if [[ "${USER:-}" != postgres ]]; then
    createuser --host=127.0.0.1 --port=5432 --username="$USER" --superuser postgres
fi
'''

[tasks."db:stop"]
description = "Stop and delete the local PostgreSQL database"
run = '''
#!/usr/bin/env -S mise -E dev exec -- bash

set -euo pipefail

data_dir="${MISE_PROJECT_ROOT}/.mise/postgres"

if [[ -s "$data_dir/PG_VERSION" ]] && pg_ctl --pgdata="$data_dir" status >/dev/null 2>&1; then
    pg_ctl --pgdata="$data_dir" --mode=fast --wait stop
fi

rm -rf "$data_dir"
'''

[tasks."db:generate"]
description = "drizzle-kit generate"
depends = ["install", "db:start"]
run = "mise -E dev exec -- pnpm -F wbapi db:generate"

[tasks."db:migrate"]
description = "drizzle-kit migrate"
depends = ["install", "db:start"]
run = "mise -E dev exec -- pnpm -F wbapi db:migrate"

[tasks."db:push"]
description = "drizzle-kit push"
depends = ["install", "db:start"]
run = "mise -E dev exec -- pnpm -F wbapi db:push"

[tasks."db:studio"]
description = "drizzle-kit studio"
depends = ["install", "db:start"]
run = "mise -E dev exec -- pnpm -F wbapi db:studio"

[tasks.dev]
description = "Start dev servers"
depends = ["db:migrate"]
depends_post = ["db:stop"]
run = "mise -E dev exec -- pnpm dev:workspace --color"

[tasks.lighthouse]
description = "Audit stats site routes with Lighthouse"
alias = "ll"
depends = ["install"]
run = '''
#!/usr/bin/env -S mise -E dev exec -- bash

set -euo pipefail
set -m

readonly base_url="http://127.0.0.1:4173"
readonly player_uid="5d2ead35d142affb05757778"
readonly reports_dir="${MISE_PROJECT_ROOT}/.mise/lighthouse"
readonly routes=(
    "home|/"
    "comparison|/${player_uid}-vs-${player_uid}"
    "leaderboard|/leaderboard"
    "leaderboard-games-elo|/leaderboard/gamesELO"
    "leaderboard-kills-elo|/leaderboard/killsELO"
    "leaderboard-xp|/leaderboard/xp"
    "player|/players/${player_uid}"
    "ranks|/ranks"
    "servers|/servers"
    "squads|/squads"
    "squad-lp|/squads/LP"
)

for reference in $(nix-store --query --references "$(mise -E dev where nix:playwright-test)"); do
    if [[ "$reference" == *-playwright-browsers ]]; then
        browsers_path="$reference"
        break
    fi
done
test -n "${browsers_path:-}"
export PLAYWRIGHT_BROWSERS_PATH="$browsers_path"

CHROME_PATH="$(pnpm --filter=@warbrokers/stats-site exec node --input-type=module -e \
    "import { chromium } from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
test -x "$CHROME_PATH"
export CHROME_PATH

if (printf '' >/dev/tcp/127.0.0.1/4173) >/dev/null 2>&1; then
    printf 'Port 4173 is already in use.\n' >&2
    exit 1
fi

pnpm turbo run build --filter=@warbrokers/stats-site --cache-dir=.turbo --color
HOST=127.0.0.1 PORT=4173 pnpm --filter=@warbrokers/stats-site exec node build &
server_pid=$!
declare -A audit_pids=()

cleanup() {
    status=$?
    trap - EXIT

    for pid in "${!audit_pids[@]}"; do
        kill -INT -- "-$pid" >/dev/null 2>&1 || true
        wait "$pid" >/dev/null 2>&1 || true
    done

    kill -INT -- "-$server_pid" >/dev/null 2>&1 || true
    wait "$server_pid" >/dev/null 2>&1 || true

    exit "$status"
}

trap cleanup EXIT
./scripts/wait-for-port 4173 "$server_pid"

rm -rf "$reports_dir"
mkdir -p "$reports_dir"

audit_route() {
    local name="$1"
    local route="$2"

    printf '\nAuditing %s\n' "$route"
    pnpm --filter=@warbrokers/stats-site exec lighthouse "${base_url}${route}" \
        --quiet \
        --chrome-flags="--headless --no-sandbox" \
        --output=html \
        --output=json \
        --output-path="${reports_dir}/${name}"
}

audit_status=0
for entry in "${routes[@]}"; do
    name="${entry%%|*}"
    route="${entry#*|}"

    audit_route "$name" "$route" &
    audit_pids[$!]="$route"
done

for pid in "${!audit_pids[@]}"; do
    if ! wait "$pid"; then
        printf 'Lighthouse failed for %s.\n' "${audit_pids[$pid]}" >&2
        audit_status=1
    fi
    unset 'audit_pids[$pid]'
done

if (( audit_status != 0 )); then
    exit 1
fi

printf '\nLighthouse reports: %s\n' "$reports_dir"
node --input-type=module - "$reports_dir" "${routes[@]}" <<'NODE'
import { readFile } from "node:fs/promises"
import { join } from "node:path"

const [reportsDir, ...entries] = process.argv.slice(2)
const rows = await Promise.all(
    entries.map(async (entry) => {
        const [name, route] = entry.split("|")
        const report = JSON.parse(
            await readFile(join(reportsDir, `${name}.report.json`), "utf8"),
        )
        const score = (category) => Math.round(report.categories[category].score * 100)
        const value = (audit) => report.audits[audit].numericValue
        const seconds = (audit) => (value(audit) / 1000).toFixed(2)

        return {
            Route: route,
            Perf: score("performance"),
            A11y: score("accessibility"),
            "Best practices": score("best-practices"),
            SEO: score("seo"),
            "Agentic browsing": score("agentic-browsing"),
            "FCP (s)": seconds("first-contentful-paint"),
            "LCP (s)": seconds("largest-contentful-paint"),
            "Speed idx (s)": seconds("speed-index"),
            "TBT (ms)": Math.round(value("total-blocking-time")),
            CLS: value("cumulative-layout-shift").toFixed(3),
            "TTI (s)": seconds("interactive"),
            "Main thread (s)": seconds("mainthread-work-breakdown"),
            "Transfer (KiB)": Math.round(value("total-byte-weight") / 1024),
        }
    }),
)

console.table(rows)

if (rows.filter((row) => row.SEO !== 100).length > 0) {
    console.error("SEO must score 100 on every audited route.")
    process.exitCode = 1
}

if (rows.filter((row) => row["Best practices"] !== 100).length > 0) {
    console.error("Best practices must score 100 on every audited route.")
    process.exitCode = 1
}

if (rows.filter((row) => row["Agentic browsing"] !== 100).length > 0) {
    console.error("Agentic browsing must score 100 on every audited route.")
    process.exitCode = 1
}
NODE
'''

[tasks.verify]
description = "Run all checks"
alias = "vv"
depends = ["install", "db:start", "lighthouse"]
depends_post = ["db:stop"]
run = '''
#!/usr/bin/env -S mise -E dev exec -- bash

set -euo pipefail
set -m

# static analysis
cspell .
pnpm fmt:check --color
pnpm lint --color
pnpm typecheck --color
pnpm --filter=@warbrokers/stats-site check
pnpm test:unit --color

# set PLAYWRIGHT_BROWSERS_PATH
for reference in $(nix-store --query --references "$(mise -E dev where nix:playwright-test)"); do
    if [[ "$reference" == *-playwright-browsers ]]; then
        browsers_path="$reference"
        break
    fi
done
test -n "${browsers_path:-}"
export PLAYWRIGHT_BROWSERS_PATH="$browsers_path"

# start dev server for E2E testing
export DATABASE_URL="postgresql://postgres@localhost:5432/postgres"
pnpm -F wbapi db:migrate
pnpm dev:workspace --color &
dev_pid=$!

cleanup() {
    status=$?
    trap - EXIT
    kill -INT -- "-$dev_pid" >/dev/null 2>&1 || true
    wait "$dev_pid" >/dev/null 2>&1 || true

    exit "$status"
}

trap cleanup EXIT

./scripts/wait-for-port 5432 "$dev_pid" # WBAPI PostgreSQL database
./scripts/wait-for-port 4000 "$dev_pid" # Mock WB
./scripts/wait-for-port 5000 "$dev_pid" # WBAPI
./scripts/wait-for-port 5173 "$dev_pid" # Stats site
./scripts/wait-for-port 3000 "$dev_pid" # WB timeline

pnpm --filter=@warbrokers/stats-site test:e2e

if ! kill -0 "$dev_pid" >/dev/null 2>&1; then
    echo "Development servers exited during E2E testing" >&2
    wait "$dev_pid"
    exit 1
fi
'''
